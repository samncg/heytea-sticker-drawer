[package]
name = "sticker-drawer"
version = "1.0.0"
description = "Desktop app for the HeyTea sticker drawer: queue pictures, pick presets, press Start and watch the phone draw."
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
